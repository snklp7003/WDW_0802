<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <div style="border:2px solid black; padding:5px;">
    <form style="text-align: center;" action="#" method="get">

        <!--action attribute specifies where the form data will be submitted-->
        <!--method attribute specifies how the form data will be sent to the server-->
        
        <h1>Hotel Room Booking Form</h1>
        <fieldset>
            <legend>Personal Information</legend>
            <p>Full Name: <input type="text" name="fullName" required></p>
            <p>Email: <input type="email" name="email" required></p>
            <p>Phone Number: <input type="tel" name="phoneNumber" required></p>
        </fieldset>
        
        <p>Check-in Date: <input type="date" name="checkInDate" required></p>
        <p>Check-out Date: <input type="date" name="checkOutDate" required></p>
        <p>Room Type:
            <select name="roomType">
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="single Ac">single Ac</option>
                <option value="double Ac">Double Ac</option>
                <option value="non-ac">Non-Air Conditioned Room</option>
            </select>
        </p>
        <p>Number of guests: <input type="number" name="numberOfGuests" min="1"></p>
        <legend>Special requests</legend>
        <textarea name="specialRequests" rows="4" cols="50"></textarea>
        <p><button type="submit">Book now</button> <button type="reset">Reset form</button></p>
    </form>
</div>
</body>
</html>
