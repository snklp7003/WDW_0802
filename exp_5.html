<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="center">Student Registration Form</h1>
    <hr>

    <form action="#" method="post">
        <label for="name" required>Full Name :</label>
        <input type="text" id="name" name="name" placeholder="enter your name"><br><br>

        <label for="email" required>Email :</label>
        <input type="email" id="email" name="email" placeholder="enter your email"><br><br>

        <label for="password" required>Password:</label>
        <input type="password" id="password" name="password" placeholder="enter password" required><br><br>
        <label >Gender:</label>
        <input type="radio" id="male" name="gender" value="male"required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female"required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other"required>
        <label for="other"> Other</label>
        <br><br>
        <lable for="course" >Course :</lable>
        <select name="course types"required>
            <option value="0">-- Select Course --</option>
            <option value="Btech CSE"required>Btech CSE</option>
            <option value="Btech CSE"required>Btech AI-ML</option>
            <option value="Btech CSE"required>Btech electrical</option>
            <option value="Btech CSE"required>Btech machanical</option>

        </select>
        <br><br>
        <label for="contact" >Contact No :</label>
        <input type="tel" id="contact" name="contact_information" placeholder="enter your 10-digit number" maxlength="10" pattern="[0-9]{10}" inputmode="numeric"required>
        <br><br>
        <label>Address :</label><br>
        <textarea name="Full_Address" placeholder="enter your full Address" row="4" col="60" required>
            
        </textarea><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        </form>
        <hr>

        <p align="center">&copy; 2025 Student Registration Portal</p>

</body>
</html>
